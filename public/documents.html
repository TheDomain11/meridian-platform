<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>Document Upload</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:system-ui;background:#f9fafb;padding:20px;color:#1f2937}.container{max-width:800px;margin:0 auto}.card{background:#fff;border-radius:12px;padding:32px;border:1px solid #e5e7eb}.form-group{margin-bottom:24px}label{display:block;font-weight:600;margin-bottom:8px}input,select,textarea{width:100%;padding:12px;border:1px solid #e5e7eb;border-radius:8px;font-family:inherit}.file-drop-zone{border:2px dashed #e5e7eb;padding:32px;text-align:center;cursor:pointer;border-radius:8px}button{padding:12px;border:none;border-radius:8px;cursor:pointer;font-weight:600}button.primary{background:#1e40af;color:#fff}button:disabled{opacity:0.5}textarea{resize:vertical;min-height:80px}.success{color:#10b981;background:#f0fdf4;padding:12px;border-radius:8px;margin-bottom:24px}.error{color:#ef4444;background:#fef2f2;padding:12px;border-radius:8px;margin-bottom:24px}</style></head>
<body>
<div class="container"><div class="card"><h1>📄 Document Upload</h1><div id="message"></div><form id="form"><div class="form-group"><label>File</label><div class="file-drop-zone" id="zone"><input type="file" id="file" required><p>Click or drag & drop</p></div></div><div class="form-group"><label>Title *</label><input type="text" id="title" required></div><div class="form-group"><label>Category *</label><select id="category" required><option>Select</option><option>Legal</option><option>Business Overview</option><option>Brand Assets</option><option>Contact & Structure</option></select></div><div class="form-group"><label>Description</label><textarea id="desc"></textarea></div><button type="submit" class="primary">Upload</button></form></div></div>
<script>
const supabase=window.supabase.createClient('https://iydyfdxgwrhodpqqgfti.supabase.co','sb_publishable_g7nm3TXNIswE24dIQ8Omcg_zPublgPq');
const zone=document.getElementById('zone'),file=document.getElementById('file'),form=document.getElementById('form'),msg=document.getElementById('message');
zone.onclick=()=>file.click();
zone.ondrop=(e)=>{e.preventDefault();file.files=e.dataTransfer.files};
zone.ondragover=(e)=>e.preventDefault();
form.onsubmit=async(e)=>{e.preventDefault();const f=file.files[0];if(!f)return;const t=document.getElementById('title').value,c=document.getElementById('category').value,d=document.getElementById('desc').value;if(!t||!c){msg.innerHTML='<div class="error">Fill required fields</div>';return}try{msg.innerHTML='<div class="success">Uploading...</div>';const fn=c+'/'+Date.now()+'_'+f.name,{error:ue}=await supabase.storage.from('business-documents').upload(fn,f);if(ue)throw ue;const{error:de}=await supabase.from('business_documents').insert([{title:t,category:c,description:d||null,file_type:f.type,file_size:f.size,storage_path:fn,uploaded_by:'Web',is_confidential:false}]);if(de)throw de;msg.innerHTML='<div class="success">✓ Uploaded!</div>';form.reset();}catch(e){msg.innerHTML='<div class="error">Error: '+e.message+'</div>'}};
</script>
</body>
</html>
